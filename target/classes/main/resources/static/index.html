<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת חידון אינטרנטי</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f4f4f9;
            --text-color: #2c3e50;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background-color); color: var(--text-color); text-align: center; padding: 20px; margin: 0; }
        .container { background: white; max-width: 700px; margin: 40px auto; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); }
        h1 { color: #2c3e50; margin-bottom: 30px; }

        /* עיצוב מסך כניסה */
        input, select { padding: 12px; margin: 10px 0; width: 90%; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 5px rgba(52, 152, 219, 0.5); }
        .icon-select-container { margin: 20px 0; }
        .icon-select-container label { font-weight: bold; display: block; margin-bottom: 10px; }
        button#join-btn { background-color: var(--secondary-color); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; margin-top: 20px; }
        button#join-btn:hover { background-color: #27ae60; transform: translateY(-2px); }

        /* פרטי שחקן (למעלה) */
        #player-info { background: #ecf0f1; padding: 15px; margin-bottom: 30px; border-radius: 10px; display: none; font-size: 18px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #player-icon-display { font-size: 1.5em; vertical-align: middle; margin-left: 10px; }

        /* עיצוב מסך השאלות */
        #question-content h3 { color: #7f8c8d; margin-top: 0; }
        #question-content h2 { color: #2c3e50; margin-bottom: 30px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .btn-option { background-color: var(--primary-color); color: white; border: none; padding: 20px; border-radius: 12px; cursor: pointer; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-option:hover { background-color: #2980b9; transform: translateY(-3px); }

        /* מסך סיום */
        #summary-container { text-align: center; }
        #summary-container h1 { color: var(--secondary-color); }
        #summary-container button { background-color: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        #summary-container button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <div id="player-info">
        <span id="player-icon-display"></span><span id="display-name"></span>
    </div>

    <div id="login-container">
        <h1>🎮 הצטרפות לחידון 🎮</h1>
        <input type="text" id="player-name" placeholder="הכנס שם תצוגה">
        <input type="number" id="quiz-code" placeholder="הכנס קוד חידון">
        <div class="icon-select-container">
            <label>בחר אייקון (דמות):</label>
            <select id="player-icon">
                <option value="🦁">🦁 אריה (עוצמה)</option>
                <option value="🦊">🦊 שועל (חכמה)</option>
                <option value="🦄">🦄 חד-קרן (קסם)</option>
                <option value="🐲">🐲 דרקון (אומץ)</option>
                <option value="🐵">🐵 קוף (זריזות)</option>
                <option value="🐙">🐙 תמנון (יצירתיות)</option>
            </select>
        </div>
        <button id="join-btn" onclick="joinQuiz()">הצטרף לחידון</button>
    </div>

    <div id="quiz-container" style="display: none;">
        <div id="question-content">
        </div>
    </div>
</div>

<script>
    let currentPlayerName = "";
    let currentQuizCode = "";
    let currentQuestionIndex = 0;
    let questionsList = []; // רשימת השאלות שתתקבל מהשרת
    let questionStartTime = 0; // זמן תחילת השאלה

    function joinQuiz() {
        currentPlayerName = document.getElementById('player-name').value.trim();
        currentQuizCode = document.getElementById('quiz-code').value.trim();
        let icon = document.getElementById('player-icon').value;

        if (!currentPlayerName || !currentQuizCode) {
            alert("⚠️ נא להזין שם וקוד חידון");
            return;
        }

        // קריאה לשרת להצטרפות (כולל האייקון)
        // ה-Controller שכתבנו ב-Java יודע לקבל imagePath
        fetch(`/api/join?playerName=${encodeURIComponent(currentPlayerName)}&gameId=${currentQuizCode}&imagePath=${icon}`, { method: 'POST' })
            .then(response => response.text())
            .then(msg => {
                if (msg.includes("בהצלחה")) {
                    // מעבר למסך החידון
                    document.getElementById('login-container').style.display = 'none';
                    document.getElementById('player-info').style.display = 'block';
                    document.getElementById('quiz-container').style.display = 'block';
                    document.getElementById('player-icon-display').innerText = icon;
                    document.getElementById('display-name').innerText = " " + currentPlayerName;

                    // טעינת רשימת השאלות המלאה מה-DB
                    loadAllQuestions();
                } else {
                    alert("⛔ " + msg);
                }
            })
            .catch(err => {
                console.error("שגיאה בהצטרפות:", err);
                alert("⛔ שגיאה בחיבור לשרת. ודא שהשרת רץ.");
            });
    }

    function loadAllQuestions() {
        // ה-Controller שכתבנו ב-Java מצפה ל-quizId
        fetch(`/api/questions?quizId=${currentQuizCode}`)
            .then(res => res.json())
            .then(data => {
                questionsList = data;
                currentQuestionIndex = 0; // אתחול האינדקס
                displayCurrentQuestion();
            })
            .catch(err => {
                console.error("שגיאה בטעינת שאלות:", err);
                alert("⛔ שגיאה בטעינת השאלות.");
            });
    }

    function displayCurrentQuestion() {
        if (questionsList.length === 0) {
            document.getElementById('question-content').innerHTML = `
                <h2>לא נמצאו שאלות לחידון זה.</h2>
                <button onclick="location.reload()">חזור</button>
            `;
            return;
        }

        if (currentQuestionIndex >= questionsList.length) {
            showSummary();
            return;
        }

        const question = questionsList[currentQuestionIndex];
        questionStartTime = Date.now(); // מתחילים למדוד זמן (מילישניות)

        // יצירת מערך תשובות וערבובן (כדי ש-ans1 לא תהיה תמיד ראשונה)
        let answers = [question.ans1, question.ans2, question.ans3, question.ans4];
        answers.sort(() => Math.random() - 0.5);

        // שימוש ב-question.content (שם העמודה ב-DB שלך)
        document.getElementById('question-content').innerHTML = `
            <h3>שאלה ${currentQuestionIndex + 1} מתוך ${questionsList.length}</h3>
            <h2>${question.content}</h2>
            <div class="options-grid">
                ${answers.map(ans => `
                    <button class="btn-option" onclick="submitAnswer('${ans.replace(/'/g, "\\'")}', ${question.questionId})">
                        ${ans}
                    </button>
                `).join('')}
            </div>
        `;
    }

    function submitAnswer(selectedText, questionId) {
        let timeTaken = Date.now() - questionStartTime;

        const params = new URLSearchParams({
            quizId: currentQuizCode,
            answerText: selectedText,
            playerName: currentPlayerName,
            questionId: questionId,
            timeTaken: timeTaken
        });

        fetch(`/api/submitAnswer?${params.toString()}`, { method: 'POST' })
            .then(response => response.text()) // מקבלים את התשובה מהשרת (correct/wrong)
            .then(result => {
                // הוספת פידבק למשתמש
                if (result.includes("correct")) {
                    alert("✅ נכון מאוד!");
                } else {
                    alert("❌ טעות...");
                }

                // אחרי הלחיצה על ה-OK של ה-alert, עוברים לשאלה הבאה
                currentQuestionIndex++;
                displayCurrentQuestion();
            })
            .catch(err => {
                console.error("שגיאה בשליחת תשובה:", err);
            });
    }

    function showSummary() {
        fetch(`/api/leaderboard?quizId=${currentQuizCode}`)
            .then(res => res.json())
            .then(players => {
                let tableHtml = `
                <h1>🏆 לוח תוצאות סופי 🏆</h1>
                <table style="width:100%; margin-top:20px; border-collapse: collapse;">
                    <tr style="background:#3498db; color:white;">
                        <th style="padding:10px;">מקום</th>
                        <th>שחקן</th>
                        <th>ניקוד</th>
                        <th>זמן כולל</th>
                    </tr>
            `;

                players.forEach((p, index) => {
                    let timeDisplay = p.totalTime ? (p.totalTime / 1000).toFixed(2) : "0.00";
                    let rowColor = index === 0 ? "#f1c40f" : "white"; // זהב למקום הראשון
                    tableHtml += `
                    <tr style="background:${rowColor}; border-bottom:1px solid #ddd;">
                        <td style="padding:10px;">${index + 1}</td>
                        <td>${p.imagePath} ${p.displayName}</td>
                        <td>${p.score}</td>
                        <td>${(p.totalTime / 1000).toFixed(2)} ש'</td>
                    </tr>
                `;
                });

                tableHtml += `</table><br><button onclick="location.reload()">משחק חדש</button>`;
                document.getElementById('quiz-container').innerHTML = tableHtml;
            });

    }
</script>

</body>
</html>
