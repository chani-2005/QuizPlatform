<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת חידון אינטרנטי</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { background: white; max-width: 600px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn-option { background-color: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-option:hover { background-color: #2980b9; }
        #player-info { background: #ecf0f1; padding: 10px; margin-bottom: 20px; border-radius: 10px; display: none; }
        input { padding: 10px; margin: 10px; width: 80%; border-radius: 5px; border: 1px solid #ddd; }
        button#join-btn { background-color: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <!-- חלק עליון: פרטי שחקנים -->
    <div id="player-info">
        <span id="display-name"></span> | ניקוד: <span id="display-score">0</span>
    </div>

    <!-- מסך כניסה -->
    <div id="login-container">
        <h1>הצטרפות לחידון</h1>
        <input type="text" id="player-name" placeholder="הכנס שם תצוגה">
        <input type="number" id="quiz-code" placeholder="הכנס קוד חידון">
        <br>
        <button id="join-btn" onclick="joinQuiz()">הצטרף לחידון</button>
    </div>

    <!-- מסך השאלות -->
    <div id="quiz-container" style="display: none;">
        <div id="question-content">
            <!-- כאן תופיע השאלה והתשובות -->
        </div>
    </div>
</div>

<script>
    let currentPlayerName = "";
    let currentQuizCode = "";
    let currentQuestionIndex = 0;
    let totalScore = 0;

    function joinQuiz() {
        currentPlayerName = document.getElementById('player-name').value;
        currentQuizCode = document.getElementById('quiz-code').value;

        if (!currentPlayerName || !currentQuizCode) {
            alert("נא להזין שם וקוד חידון");
            return;
        }

        // עדכון ה-URL בדפדפן ללא רענון
        const newUrl = window.location.pathname + `?code=${currentQuizCode}&player=${encodeURIComponent(currentPlayerName)}`;
        window.history.pushState({}, '', newUrl);

        // מעבר למסך החידון
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('player-info').style.display = 'block';
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('display-name').innerText = "שחקן: " + currentPlayerName;

        loadQuestion();
    }

    function loadQuestion() {
        // שליפת שאלה באופן א-סינכרוני[cite: 1]
        fetch(`/api/question?code=${currentQuizCode}&index=${currentQuestionIndex}`)
            .then(response => {
                if (response.status === 204 || response.status === 404) return null;
                return response.json();
            })
            .then(question => {
                if (!question) {
                    showSummary(); // סיום החידון[cite: 1]
                    return;
                }

                // יצירת מערך תשובות וערבובן (סדר אקראי)[cite: 1]
                let answers = [
                    { text: question.ans1 },
                    { text: question.ans2 },
                    { text: question.ans3 },
                    { text: question.ans4 }
                ];
                answers.sort(() => Math.random() - 0.5);

                // שימוש ב-question.content כפי שביקשת
                document.getElementById('question-content').innerHTML = `
                    <h3>שאלה ${currentQuestionIndex + 1}</h3>
                    <h2>${question.content}</h2>
                    <div class="options-grid">
                        ${answers.map(ans => `
                            <button class="btn-option" onclick="submitAnswer('${ans.text.replace(/'/g, "\\'")}')">
                                ${ans.text}
                            </button>
                        `).join('')}
                    </div>
                `;
            })
            .catch(err => console.error("שגיאה בטעינת שאלה:", err));
    }

    function submitAnswer(selectedText) {
        // שליחת התשובה לשרת[cite: 1]
        const params = new URLSearchParams({
            code: currentQuizCode,
            answerText: selectedText,
            playerName: currentPlayerName,
            index: currentQuestionIndex
        });

        fetch(`/api/submitAnswer?${params.toString()}`, { method: 'POST' })
            .then(response => response.text())
            .then(result => {
                if (result.startsWith("finished")) {
                    showSummary(); // קריאה לפונקציית הסיום
                    return;
                }

                const parts = result.split(':');
                const status = parts[0];
                const pointsWon = parseInt(parts[1] || 0);

                if (status === "correct") {
                    alert("נכון מאוד! זכית ב-" + pointsWon + " נקודות");
                    totalScore += pointsWon; // עדכון הניקוד המקומי
                    document.getElementById('display-score').innerText = totalScore; // עדכון התצוגה למעלה
                } else if (status === "wrong") {
                    alert("טעות!");
                }

                currentQuestionIndex++; // קידום מספר השאלה[cite: 1]
                loadQuestion(); // טעינת השאלה הבאה
            })
            .catch(err => console.error("שגיאה בשליחת תשובה:", err));
    }

    function showSummary() {
        document.getElementById('quiz-container').innerHTML = `
            <h1>כל הכבוד!</h1>
            <p>סיימת את החידון.</p>
            <button onclick="location.reload()">חזור להתחלה</button>
        `;
    }
</script>

</body>
</html>
