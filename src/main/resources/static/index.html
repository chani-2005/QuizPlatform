<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת חידון אינטרנטי</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f4f4f9;
            --text-color: #2c3e50;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            text-align: center;
            padding: 20px;
            margin: 0;
            direction: rtl; /* מבטיח כיוון עברית נכון */
        }
        .container { background: white; max-width: 700px; margin: 40px auto; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); }
        input, select { padding: 12px; margin: 10px 0; width: 90%; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; border: none; margin: 10px; }
        .btn-player { background-color: var(--secondary-color); color: white; }
        .btn-admin { background-color: var(--primary-color); color: white; }
        .quiz-card { border: 1px solid #ddd; padding: 15px; margin: 10px; border-radius: 10px; background: #fafafa; text-align: right; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .btn-option { background-color: var(--primary-color); color: white; padding: 20px; border-radius: 12px; }
        #player-info { background: #ecf0f1; padding: 15px; margin-bottom: 30px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-selection">
        <h1>🎮 ברוכים הבאים לחידון 🎮</h1>
        <p>בחר סוג כניסה:</p>
        <button onclick="showSection('player')" class="btn-player">אני שחקן - כניסה לחידון</button>
        <button onclick="showSection('admin')" class="btn-admin">אני מנהל - ניהול חידונים</button>
    </div>

    <div id="player-section" style="display:none;">
        <h1>הצטרפות כשחקן</h1>
        <input type="text" id="player-name" placeholder="הכנס שם תצוגה">
        <input type="number" id="quiz-code-input" placeholder="הכנס קוד חידון">

        <div class="icon-select-container">
            <label>בחר דמות:</label>
            <select id="player-icon">
                <optgroup label="חיות">
                    <option value="🦁">🦁 אריה</option>
                    <option value="🦒">🦒 ג'ירפה</option>
                    <option value="🐘">🐘 פיל</option>
                    <option value="🦊">🦊 שועל</option>
                    <option value="🦄">🦄 חד קרן</option>
                </optgroup>
                <optgroup label="דמויות ואוכל">
                    <option value="🥷">🥷 נינג'ה</option>
                    <option value="👨‍🚀">👨‍🚀 אסטרונאוט</option>
                    <option value="🍕">🍕 פיצה</option>
                    <option value="🚀">🚀 חללית</option>
                    <option value="🤖">🤖 רובוט</option>
                </optgroup>
            </select>
        </div>
        <div id="leaderboard-bar" style="background: #34495e; color: white; padding: 10px; margin-bottom: 15px; border-radius: 5px; display: flex; gap: 15px; overflow-x: auto;">
            <span>משתתפים:</span>
            <div id="players-list-live">טוען משתתפים...</div>
        </div>
        <button class="btn-player" onclick="joinQuiz()">הצטרף עכשיו</button>
        <br><button onclick="location.reload()" style="background:none; color:gray; font-size:14px; text-decoration:underline;">חזור לתפריט</button>
    </div>

    <div id="admin-section" style="display:none;">
        <h1>ניהול חידונים</h1>

        <div id="login-required-msg" style="display:none;">
            <p>כדי לנהל חידונים, יש להתחבר למערכת:</p>
            <button class="btn-admin" onclick="window.location.href='/oauth2/authorization/google'">
                🔵 התחברות באמצעות Google
            </button>
        </div>

        <div id="admin-content" style="display:none;">
            <div style="background: #ecf0f1; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: right;">
                <h3>➕ יצירת חידון חדש</h3>
                <input type="text" id="new-quiz-name" placeholder="שם החידון">
                <input type="datetime-local" id="new-quiz-start" title="זמן התחלה">
                <input type="datetime-local" id="new-quiz-end" title="זמן סיום">
                <button class="btn-admin" onclick="createNewQuiz()">צור חידון</button>
            </div>

            <hr>
            <h3>📋 החידונים שלי</h3>
            <div id="admin-quizzes-list"></div>
        </div>

        <br><button onclick="location.reload()" style="background:none; color:gray; text-decoration:underline;">חזור לתפריט</button>
    </div>
    <div id="quiz-display-area" style="display:none;">
        <div id="player-info-box">
            <span id="player-icon-display" style="font-size: 2em;"></span>
            <b id="display-name-top" style="font-size: 1.5em;"></b>
        </div>
        <hr>
        <div id="question-content"></div>
<!--        <div id="timer-display" style="font-size: 24px; color: red; font-weight: bold; text-align: center; margin-bottom: 10px;">-->
<!--            זמן נותר: <span id="seconds">30</span> שניות-->
<!--        </div>-->
    </div>
</div>


<script>
    let countdownInterval;
    let currentPlayerName = "";
    let currentQuizCode = "";
    let questionsList = [];
    let currentQuestionIndex = 0;
    let questionStartTime = 0;

    function showSection(type) {
        document.getElementById('main-selection').style.display = 'none';
        if(type === 'player') {
            document.getElementById('player-section').style.display = 'block';
        } else {
            // כשלוחצים על מנהל - קודם כל מנסים לטעון את החידונים שלו
            // אם הוא לא מחובר, השרת יחזיר 401 והפונקציה תשלח אותו לגוגל
            checkAdminStatus();
        }
    }

    function checkAdminStatus() {
        fetch('/api/my-quizzes')
            .then(res => {
                if (res.status === 401 || res.status === 403) {
                    // המשתמש לא מחובר - מציגים את אזור ההתחברות
                    document.getElementById('admin-section').style.display = 'block';
                    document.getElementById('login-required-msg').style.display = 'block';
                    document.getElementById('admin-content').style.display = 'none';
                    return null; // עוצרים כאן
                }
                return res.json();
            })
            .then(quizzes => {
                if (quizzes !== null) {
                    // המשתמש מחובר - מציגים את התוכן והחידונים
                    document.getElementById('admin-section').style.display = 'block';
                    document.getElementById('login-required-msg').style.display = 'none';
                    document.getElementById('admin-content').style.display = 'block';
                    renderQuizList(quizzes);
                }
            })
            .catch(err => {
                console.error("שגיאה בבדיקת התחברות:", err);
                // במקרה של שגיאת תקשורת, נציג בכל זאת את כפתור ההתחברות
                document.getElementById('admin-section').style.display = 'block';
                document.getElementById('login-required-msg').style.display = 'block';
            });
    }

    function editQuiz(quizCode) {
        const newName = prompt("שם חידון חדש:");
        const newStart = prompt("זמן התחלה (YYYY-MM-DDTHH:MM):");
        const newEnd = prompt("זמן סיום (YYYY-MM-DDTHH:MM):");
        const deleteExisting = confirm("האם למחוק את כל השאלות הקיימות ולהעלות חדשות?");

        if (newName && newStart && newEnd) {
            // בניית כתובת ה-URL עם הפרמטרים
            const url = `/api/update-quiz-details?quizId=${quizCode}&name=${encodeURIComponent(newName)}&start=${newStart}&end=${newEnd}&deleteExisting=${deleteExisting}`;

            fetch(url, { method: 'POST' })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    checkAdminStatus(); // רענון הרשימה
                })
                .catch(err => alert("שגיאה בעדכון: " + err));
        }
    }

    function joinQuiz() {
        currentPlayerName = document.getElementById('player-name').value;
        currentQuizCode = document.getElementById('quiz-code-input').value;
        let icon = document.getElementById('player-icon').value;

        if(!currentPlayerName || !currentQuizCode) { alert("מלא את כל הפרטים"); return; }

        fetch(`/api/join?playerName=${encodeURIComponent(currentPlayerName)}&gameId=${currentQuizCode}&imagePath=${icon}`, { method: 'POST' })
            .then(res => res.text())
            .then(msg => {
                if(msg.includes("בהצלחה")) {
                    document.getElementById('player-section').style.display = 'none';
                    document.getElementById('quiz-display-area').style.display = 'block';
                    document.getElementById('player-icon-display').innerText = icon;
                    document.getElementById('display-name-top').innerText = " " + currentPlayerName;
                    loadAllQuestions();
                } else {
                    alert(msg);
                }
            });
    }

    function loadAllQuestions() {
        fetch(`/api/questions?quizId=${currentQuizCode}`)
            .then(res => res.json())
            .then(data => {
                questionsList = data;
                displayCurrentQuestion();
            });
    }

    // עדכון פונקציית הצגת השאלה (X מתוך Y)
    function displayCurrentQuestion() {
        if (currentQuestionIndex >= questionsList.length) {
            showSummary();
            return;
        }

        const q = questionsList[currentQuestionIndex];
        questionStartTime = Date.now();

        // ערבוב תשובות
        let answers = [q.ans1, q.ans2, q.ans3, q.ans4].sort(() => Math.random() - 0.5);

        document.getElementById('question-content').innerHTML = `
        <div id="timer-display" style="font-size: 20px; color: red; font-weight: bold;">
            זמן נותר: <span id="seconds">30</span> שניות
        </div>
        <h3 style="color: #7f8c8d;">שאלה ${currentQuestionIndex + 1} מתוך ${questionsList.length}</h3>
        <h2 style="font-size: 24px; margin-bottom: 20px;">${q.content}</h2>
        <div class="options-grid" id="options-container">
            ${answers.map(ans => `
                <button class="btn-option" onclick="handleAnswerClick(this, '${ans.replace(/'/g, "\\'")}', ${q.questionId})">
                    ${ans}
                </button>
            `).join('')}
        </div>`;

        startTimer(); // <<< חשוב: קריאה לפונקציה כדי שהשעון יתחיל לרוץ!
    }

    function startTimer() {
        let timeLeft = 30;
        if(window.quizInterval) clearInterval(window.quizInterval);

        window.quizInterval = setInterval(() => {
            timeLeft--;
            const secElem = document.getElementById('seconds');
            if(secElem) secElem.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(window.quizInterval);
                alert("נגמר הזמן!");
                currentQuestionIndex++; // מעבר לשאלה הבאה
                displayCurrentQuestion();
            }
        }, 1000);
    }

    function handleAnswerClick(btn, ans, qId) {
        clearInterval(window.quizInterval); // עצירת הטיימר מיד עם הלחיצה!
        submitAnswer(btn, ans, qId); // הפונקציה המקורית שלך ששולחת לשרת
    }
    // עדכון שליחת תשובה ללא ALERT
    function submitAnswer(buttonElement, ans, id) {
        let time = Date.now() - questionStartTime;

        // מניעת לחיצות כפולות
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(btn => btn.disabled = true);

        fetch(`/api/submitAnswer?quizId=${currentQuizCode}&answerText=${encodeURIComponent(ans)}&playerName=${currentPlayerName}&questionId=${id}&timeTaken=${time}`, { method: 'POST' })
            .then(res => res.text())
            .then(res => {
                // פידבק ויזואלי במקום ALERT
                if(res.includes("correct")) {
                    buttonElement.style.background = "#2ecc71"; // ירוק
                } else {
                    buttonElement.style.background = "#e74c3c"; // אדום
                }

                // המתנה של שנייה אחת ומעבר לשאלה הבאה
                setTimeout(() => {
                    currentQuestionIndex++;
                    displayCurrentQuestion();
                }, 1000);
            });
    }

    // עדכון סיכום סופי והצגת מנצח (סעיף 20)
    function showSummary() {
        fetch(`/api/leaderboard?quizId=${currentQuizCode}`)
            .then(res => res.json())
            .then(players => {
                if(players.length === 0) return;

                const winner = players[0]; // הראשון ברשימה הממוינת הוא המנצח

                let html = `
                <div style="padding: 20px; border: 3px solid #f1c40f; border-radius: 15px; background: #fffdf0;">
                    <h1 style="font-size: 40px;">🏆 המנצח הגדול 🏆</h1>
                    <div style="font-size: 60px;">${winner.imagePath}</div>
                    <h2 style="font-size: 30px; color: #2c3e50;">${winner.displayName}</h2>
                    <p style="font-size: 20px;">עם ניקוד של <b>${winner.score}</b> נקודות!</p>
                </div>
                <hr>
                <h3>לוח תוצאות מלא:</h3>
                <ul style="list-style: none; padding: 0;">
                    ${players.map((p, index) => `
                        <li style="padding: 10px; border-bottom: 1px solid #eee;">
                            ${index + 1}. ${p.imagePath} ${p.displayName} - ${p.score} נק'
                        </li>
                    `).join('')}
                </ul>
                <button onclick="location.reload()" class="btn-player">חזור להתחלה</button>
            `;
                document.getElementById('question-content').innerHTML = html;
            });
    }

    // פונקציה ליצירת חידון חדש
    function createNewQuiz() {
        const name = document.getElementById('new-quiz-name').value;
        const start = document.getElementById('new-quiz-start').value;
        const end = document.getElementById('new-quiz-end').value;

        if(!name || !start || !end) { alert("נא למלא שם וזמנים"); return; }

        fetch('/api/create-quiz', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                quizName: name,
                startTime: start,
                endTime: end
            })
        })
            .then(res => {
                if (!res.ok) throw new Error("שגיאה ביצירת החידון");
                return res.json();
            })
            .then(quiz => {
                alert(`החידון "${quiz.quizName}" נוצר בהצלחה! מספר החידון: ${quiz.quizCode}`);

                // ניקוי השדות
                document.getElementById('new-quiz-name').value = '';
                document.getElementById('new-quiz-start').value = '';
                document.getElementById('new-quiz-end').value = '';

                // רענון הרשימה כדי שהחידון החדש יופיע מיד עם כפתור האקסל
                checkAdminStatus();
            })
            .catch(err => alert(err.message));
    }
    // עדכון טעינת החידונים - עכשיו לא צריך לשלוח מייל, השרת יודע מי את מהגוגל!
    function loadMyQuizzes() {
        fetch('/api/my-quizzes') // השרת יזהה את המשתמש מה-Session של גוגל
            .then(res => {
                if (res.status === 401) {
                    alert("יש להתחבר עם גוגל כדי לצפות בחידונים");
                    return [];
                }
                return res.json();
            })
            .then(quizzes => {
                const list = document.getElementById('admin-quizzes-list');
                list.innerHTML = '<h3>החידונים שלך:</h3>';
                if(!quizzes || quizzes.length === 0) {
                    list.innerHTML += "<p>לא נמצאו חידונים תחת החשבון שלך</p>";
                    return;
                }
                quizzes.forEach(q => {
                    list.innerHTML += `
                    <div class="quiz-card">
                        <b>שם: ${q.quizName}</b> | קוד: ${q.quizCode}
                        <br>
                        <button onclick="editQuiz(${q.quizCode})" style="font-size:12px; background:#e67e22; color:white; padding:5px 10px;">🔧 עדכן פרטים</button>
                        <button onclick="uploadExcel(${q.quizCode})" style="font-size:12px; background:#27ae60; color:white; padding:5px 10px;">📤 העלאת אקסל</button>
                    </div>`;
                });
            });
    }

    // פונקציה להצגת רשימת החידונים עם כפתורי פעולה
    function renderQuizList(quizzes) {
        const list = document.getElementById('admin-quizzes-list');
        list.innerHTML = ''; // ניקוי הרשימה הישנה

        quizzes.forEach(q => {
            const card = document.createElement('div');
            card.style = "border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9;";
            card.innerHTML = `
            <div style="display: flex; justify-content: space-between;">
                <div>
                    <strong>${q.quizName}</strong> (קוד: ${q.quizCode}) [cite: 6]
                    <br><small>בתוקף מ: ${new Date(q.startTime).toLocaleString()} עד: ${new Date(q.endTime).toLocaleString()}</small> [cite: 9]
                </div>
                <div>
                    <button onclick="editQuiz(${q.quizCode})" style="background: #f39c12; color: white;">🔧 עדכון זמן/שם</button> [cite: 14]
                </div>
            </div>
            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ddd;">
                <label>טעינת שאלות (Excel):</label> [cite: 7]
                <input type="file" id="file-${q.quizCode}" accept=".xlsx, .xls">
                <button onclick="uploadExcel(${q.quizCode})" style="background: #27ae60; color: white;">📤 שלח קובץ</button> [cite: 14]
            </div>
        `;
            list.appendChild(card);
        });
    }
    // פונקציה לשליחת קובץ האקסל לשרת
    function uploadExcel(quizId) {
        const fileInput = document.getElementById(`file-${quizId}`);
        if (fileInput.files.length === 0) {
            alert("נא לבחור קובץ אקסל");
            return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        formData.append("quizId", quizId);

        fetch('/api/upload-questions', {
            method: 'POST',
            body: formData
        })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert("שגיאה בהעלאה: " + err));
    }

    function updateLiveLeaderboard() {
        if (!currentQuizCode) return;

        fetch(`/api/leaderboard?quizId=${currentQuizCode}`)
            .then(res => res.json())
            .then(players => {
                const listDiv = document.getElementById('players-list-live');
                listDiv.innerHTML = players.map(p => `
                <span style="border-left: 1px solid #7f8c8d; padding-left: 10px;">
                    <img src="${p.imagePath}" width="20" style="border-radius:50%">
                    ${p.displayName}: <b>${p.score}</b>
                </span>
            `).join('');
            });
    }

    // הפעלה אוטומטית כל 2 שניות (Asynchronous)
    setInterval(() => {
        if (currentQuizCode) { // רק אם אנחנו בתוך משחק
            fetch(`/api/leaderboard?quizId=${currentQuizCode}`)
                .then(res => res.json())
                .then(players => {
                    const list = document.getElementById('players-list-top');
                    list.innerHTML = players.map(p =>
                        `<span><img src="${p.imagePath}" width="20"> ${p.displayName}: ${p.score}</span>`
                    ).join(' | ');
                });
        }
    }, 3000); // מעדכן כל 3 שניות את כולם
    setInterval(updateLiveLeaderboard, 2000);
</script>
</body>
</html>
